<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sélection gourmande</title>
  <style>
    :root{
      --bg:#f7f2ea;
      --ink:#2d271f;
      --muted:#6f665a;
      --card:#fffdf8;
      --line:rgba(70,52,30,.12);
      --shadow:0 12px 32px rgba(42,30,14,.10);
      --radius:22px;
      --space:24px;
      --space-sm:16px;
      --accent:#b7842c;
      --accent-soft:rgba(183,132,44,.14);
      --hero-start:#d3a647;
      --hero-end:#7b5521;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.72), transparent 28%),
        linear-gradient(180deg, #fbf7f1 0%, #f3ece1 100%);
      color:var(--ink);
      font-family: ui-serif, Georgia, "Times New Roman", Times, serif;
      line-height:1.55;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(135deg, rgba(255,255,255,.18), transparent 36%),
        radial-gradient(circle at 85% 10%, rgba(255,255,255,.28), transparent 18%);
      opacity:.9;
    }
    .wrap{
      position:relative;
      z-index:1;
      max-width:1100px;
      margin:0 auto;
      padding:28px 24px 36px;
    }
    .site-head{
      margin:0 0 var(--space);
      padding:22px 24px;
      border-radius:var(--radius);
      background:rgba(255,251,244,.72);
      border:1px solid rgba(115,82,36,.08);
      box-shadow:var(--shadow);
      backdrop-filter:blur(8px);
    }
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 12px;
      border-radius:999px;
      font-size:12px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--accent);
      background:var(--accent-soft);
    }
    .site-head h1{
      margin:14px 0 8px;
      font-size:clamp(32px, 5vw, 52px);
      line-height:1.02;
      letter-spacing:.02em;
    }
    .lead{
      max-width:720px;
      margin:0;
      color:var(--muted);
      font-size:clamp(17px, 2.3vw, 20px);
    }
    .tabs{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin:0 0 var(--space);
    }
    .tab{
      appearance:none;
      border:1px solid var(--line);
      background:rgba(255,255,255,.72);
      color:var(--ink);
      border-radius:999px;
      padding:12px 18px;
      font:inherit;
      font-size:16px;
      cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
      box-shadow:0 8px 18px rgba(42,30,14,.05);
    }
    .tab:hover,
    .tab:focus-visible{
      transform:translateY(-1px);
      border-color:rgba(70,52,30,.22);
      outline:none;
    }
    .tab[aria-selected="true"]{
      background:var(--accent);
      color:#fff;
      border-color:transparent;
      box-shadow:0 14px 24px rgba(42,30,14,.15);
    }
    .tab-panel{
      display:none;
    }
    .tab-panel.is-active{
      display:block;
    }
    .hero{
      position:relative;
      overflow:hidden;
      min-height:300px;
      border-radius:var(--radius);
      margin:0 0 var(--space);
      background:linear-gradient(135deg, var(--hero-start), var(--hero-end));
      box-shadow:var(--shadow);
      isolation:isolate;
    }
    .hero img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      filter:contrast(.94) saturate(.92) brightness(.88);
    }
    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(33,24,14,.14), rgba(33,24,14,.62)),
        linear-gradient(120deg, rgba(255,255,255,.12), transparent 34%);
      z-index:1;
    }
    .hero-content{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      min-height:300px;
      padding:28px;
      color:#fff;
    }
    .hero-kicker{
      display:inline-flex;
      width:max-content;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.22);
      font-size:13px;
      letter-spacing:.1em;
      text-transform:uppercase;
    }
    .hero h2{
      margin:14px 0 8px;
      font-size:clamp(30px, 4vw, 46px);
      line-height:1.02;
    }
    .hero p{
      max-width:640px;
      margin:0;
      font-size:clamp(16px, 2vw, 18px);
      color:rgba(255,247,236,.92);
    }
    .intro,
    .producer{
      background:var(--card);
      border:1px solid rgba(117,86,39,.09);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      margin:0 0 var(--space);
    }
    .intro{
      padding:22px 24px;
    }
    .intro h3,
    .producer h3{
      margin:0 0 10px;
      font-size:24px;
    }
    .intro p{
      margin:0;
      color:var(--muted);
      font-size:17px;
    }
    .producer{
      display:grid;
      grid-template-columns:minmax(0, 280px) minmax(0, 1fr);
      gap:22px;
      padding:22px;
      align-items:center;
    }
    .producer-photo{
      margin:0;
      width:100%;
      aspect-ratio:4/3;
      border-radius:18px;
      overflow:hidden;
      background:linear-gradient(135deg, rgba(255,244,218,.95), rgba(214,183,128,.65));
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);
    }
    .producer-photo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .producer-body p{
      margin:0 0 12px;
      color:var(--muted);
      font-size:16px;
    }
    .producer-body p:last-child{
      margin-bottom:0;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:20px;
    }
    .card{
      display:flex;
      flex-direction:column;
      min-height:100%;
      overflow:hidden;
      border-radius:var(--radius);
      background:var(--card);
      border:1px solid rgba(117,86,39,.08);
      box-shadow:var(--shadow);
    }
    .photo{
      aspect-ratio:4/3;
      background:linear-gradient(135deg, rgba(255,245,220,.92), rgba(223,205,176,.9));
    }
    .card img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .body{
      display:flex;
      flex:1;
      flex-direction:column;
      padding:18px 18px 20px;
    }
    .body h3{
      margin:0 0 8px;
      font-size:22px;
    }
    .body p{
      margin:0 0 14px;
      color:var(--muted);
      font-size:15px;
    }
    .prices{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:auto;
    }
    .pill{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:3px;
      padding:9px 12px;
      border-radius:14px;
      background:rgba(255,255,255,.9);
      border:1px solid rgba(117,86,39,.12);
      font-size:14px;
    }
    .pill-label{
      font-size:11px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--accent);
    }
    .status-note{
      display:inline-flex;
      align-self:flex-start;
      padding:9px 12px;
      border-radius:14px;
      background:var(--accent-soft);
      color:var(--accent);
      font-size:14px;
    }
    footer{
      margin:36px 0 0;
      text-align:center;
      color:var(--muted);
      font-size:14px;
    }
    .app[data-theme="miel"]{
      --accent:#ba8b29;
      --accent-soft:rgba(186,139,41,.14);
      --hero-start:#dfb34e;
      --hero-end:#8a5d20;
    }
    .app[data-theme="vin"]{
      --accent:#7f2e40;
      --accent-soft:rgba(127,46,64,.14);
      --hero-start:#9f4558;
      --hero-end:#431620;
    }
    .app[data-theme="porc"]{
      --accent:#b55d3a;
      --accent-soft:rgba(181,93,58,.14);
      --hero-start:#cf845d;
      --hero-end:#6d3624;
    }
    @media (max-width:760px){
      .wrap{
        padding:20px 16px 28px;
      }
      .site-head,
      .intro,
      .producer{
        padding-left:18px;
        padding-right:18px;
      }
      .producer{
        grid-template-columns:1fr;
      }
      .grid{
        grid-template-columns:1fr;
        gap:16px;
      }
      .tabs{
        gap:10px;
      }
      .tab{
        flex:1 1 0;
        min-width:0;
        text-align:center;
      }
      .hero,
      .hero-content{
        min-height:260px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap app" id="appShell" data-theme="miel">
    <header class="site-head">
      <div class="eyebrow">Accès réservé</div>
      <h1>Sélection artisanale à partager autour de la table</h1>
      <p class="lead">Un espace privé pour retrouver une sélection de miel, de vins et de spécialités de porc, présentée dans le même esprit que le catalogue précédent.</p>
    </header>

    <nav class="tabs" id="tablist" role="tablist" aria-label="Catalogues produits"></nav>
    <main id="panels"></main>

    <footer>Lien du site à ne pas partager</footer>
  </div>

  <script>
  var SECTIONS = [
    {

        ]

          options: [
            { label: "500 g", price: "8,50 €" },
            { label: "1 kg", price: "16,00 €" }
          ]
        },
        {
          id: "miel-montagne",
          name: "Miel montagne",
          image: "images/miel/miel-montagne.jpg",
          description: "Un profil plus soutenu, avec une note plus intense qui accompagne bien fromages et tartines.",
          options: [
            { label: "500 g", price: "10,00 €" },
            { label: "1 kg", price: "18,00 €" }
          ]
        },
        {
          id: "nougat-cuillere",
          name: "Nougat à la cuillère",
          image: "images/miel/nougat-cuillere.jpg",
          description: "Une gourmandise à la texture fondante, idéale pour terminer un repas ou composer un cadeau.",
          options: [
            { label: "Prix", price: "9,50 €" }
          ]
        }
      ]
    },
    {
      slug: "vin",
      label: "Vin",
      kicker: "Sélection de vins",
      heroTitle: "Des bouteilles choisies pour les repas de fête",
      heroSubtitle: "Une collection courte, lisible et facile à présenter, avec une dominante bordelaise et une ouverture sur la Provence.",
      heroImage: "images/vin/hero.jpg",
      introTitle: "Présentation",
      introText: "Une sélection de vins de caractère, majoritairement bordelais, choisie pour accompagner les repas de fête et les moments de partage.",
      products: [
        {
          id: "pessac-leognan-2024",
          name: "Pessac-Leognan 2024",
          image: "images/vin/pessac-leognan-2024.jpg",
          description: "Une bouteille à la trame élégante, facile à proposer en début de sélection.",
          options: [

          ]
        },
        {
          id: "saint-julien-2023",

          ]

        {
          id: "pomerol-2024",
          name: "Pomerol 2024",
          image: "images/vin/pomerol-2024.jpg",
          description: "Une cuvée ronde et ample, adaptée aux repas plus gourmands.",
          options: [
            { label: "Prix", price: "15,00 €" }
          ]
        },
        {
          id: "cote-de-provence-grand-cru-2024",
          name: "Côte de Provence grand cru 2024",
          image: "images/vin/cote-de-provence-grand-cru-2024.jpg",
          description: "Une alternative plus lumineuse dans la sélection, pour varier les accords.",

          ]
        },

          name: "Pessac Léognan",

    },
    {

      heroImage: "images/porc/hero.jpg",
      introTitle: "À venir",
      introText: "Cette page pose la base de la future sélection porc, avec les premiers produits et un espace prêt à recevoir les tarifs.",
      producer: {
        title: "Le producteur",
        image: "images/porc/producteur.jpg",
        alt: "Producteur de porc",
        paragraphs: [
          "Le producteur de porc sera présenté ici avec quelques lignes sur sa ferme, ses méthodes et son approche artisanale.",
          "Pour cette première version, le bloc est volontairement concis afin de pouvoir être remplacé très vite par une présentation plus précise.",
          "Dès que tu me transmets les informations réelles, je peux mettre à jour ce texte sans toucher à la structure de la page."
        ]
      },
      products: [
        {
          id: "rillettes-porc",
          name: "Rillettes de porc",
          image: "images/porc/rillettes-porc.jpg",

          note: "Informations tarifaires à compléter."
        },
        {
          id: "saucisses-porc",
          name: "Saucisses de porc",
          image: "images/porc/saucisses-porc.jpg",
          description: "Une proposition simple et familiale qui complète naturellement la sélection.",
          note: "Informations tarifaires à compléter."
        }
      ]
    }
  ];

  function escapeHtml(value){
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function renderTabs(){
    var html = "";
    for (var i = 0; i < SECTIONS.length; i++) {
      var section = SECTIONS[i];
      html += '<button class="tab" id="tab-' + section.slug + '" type="button" role="tab" aria-selected="false" aria-controls="panel-' + section.slug + '" tabindex="-1" data-slug="' + section.slug + '">' + escapeHtml(section.label) + '</button>';
    }
    document.getElementById("tablist").innerHTML = html;
  }

  function renderProducer(producer, section){
    if (!producer) {
      return "";
    }

    var html = '<section class="producer">';
    html += '<figure class="producer-photo">';
    html += '<img src="' + producer.image + '" alt="' + escapeHtml(producer.alt) + '" data-fallback-label="' + escapeHtml(producer.title) + '" data-fallback-tone="' + section.slug + '">';
    html += '</figure>';
    html += '<div class="producer-body">';
    html += '<h3>' + escapeHtml(producer.title) + '</h3>';
    for (var i = 0; i < producer.paragraphs.length; i++) {
      html += '<p>' + escapeHtml(producer.paragraphs[i]) + '</p>';
    }
    html += '</div>';
    html += '</section>';
    return html;
  }

  function renderProducts(products, section){
    var html = '<div class="grid">';
    for (var i = 0; i < products.length; i++) {
      var product = products[i];
      html += '<article class="card" id="' + product.id + '">';
      html += '<div class="photo">';
      html += '<img src="' + product.image + '" alt="' + escapeHtml(product.name) + '" data-fallback-label="' + escapeHtml(product.name) + '" data-fallback-tone="' + section.slug + '">';
      html += '</div>';
      html += '<div class="body">';
      html += '<h3>' + escapeHtml(product.name) + '</h3>';
      html += '<p>' + escapeHtml(product.description) + '</p>';
      if (product.options && product.options.length) {
        html += '<div class="prices">';
        for (var j = 0; j < product.options.length; j++) {
          var option = product.options[j];
          html += '<span class="pill">';
          html += '<span class="pill-label">' + escapeHtml(option.label) + '</span>';
          html += '<span>' + escapeHtml(option.price) + '</span>';
          html += '</span>';
        }
        html += '</div>';
      } else if (product.note) {
        html += '<span class="status-note">' + escapeHtml(product.note) + '</span>';
      }
      html += '</div>';
      html += '</article>';
    }
    html += '</div>';
    return html;
  }

  function renderPanels(){
    var html = "";
    for (var i = 0; i < SECTIONS.length; i++) {
      var section = SECTIONS[i];
      html += '<section class="tab-panel" id="panel-' + section.slug + '" role="tabpanel" aria-labelledby="tab-' + section.slug + '" data-slug="' + section.slug + '">';
      html += '<header class="hero">';
      html += '<img src="' + section.heroImage + '" alt="' + escapeHtml(section.label) + '" data-fallback-label="' + escapeHtml(section.label) + '" data-fallback-tone="' + section.slug + '">';
      html += '<div class="hero-content">';
      html += '<span class="hero-kicker">' + escapeHtml(section.kicker) + '</span>';
      html += '<h2>' + escapeHtml(section.heroTitle) + '</h2>';
      html += '<p>' + escapeHtml(section.heroSubtitle) + '</p>';
      html += '</div>';
      html += '</header>';
      html += '<section class="intro">';
      html += '<h3>' + escapeHtml(section.introTitle) + '</h3>';
      html += '<p>' + escapeHtml(section.introText) + '</p>';
      html += '</section>';
      html += renderProducer(section.producer, section);
      html += renderProducts(section.products, section);
      html += '</section>';
    }
    document.getElementById("panels").innerHTML = html;
  }

  function fallbackPalette(tone){
    if (tone === "vin") {
      return { start: "#b0596a", end: "#4d1a26", text: "#fff5f7" };
    }
    if (tone === "porc") {
      return { start: "#d79069", end: "#713725", text: "#fff7f2" };
    }
    return { start: "#e0b451", end: "#875c22", text: "#fff9ef" };
  }

  function makePlaceholder(label, tone){
    var palette = fallbackPalette(tone);
    var safeLabel = String(label).replace(/[&<>"]/g, "");
    var svg = ''
      + '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">'
      + '<defs>'
      + '<linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">'
      + '<stop offset="0%" stop-color="' + palette.start + '"/>'
      + '<stop offset="100%" stop-color="' + palette.end + '"/>'
      + '</linearGradient>'
      + '</defs>'
      + '<rect width="1200" height="900" fill="url(#g)"/>'
      + '<circle cx="980" cy="170" r="120" fill="rgba(255,255,255,.12)"/>'
      + '<circle cx="180" cy="760" r="180" fill="rgba(255,255,255,.08)"/>'
      + '<text x="50%" y="48%" text-anchor="middle" fill="' + palette.text + '" font-family="Georgia, serif" font-size="52" letter-spacing="2">' + safeLabel + '</text>'
      + '<text x="50%" y="58%" text-anchor="middle" fill="' + palette.text + '" opacity=".85" font-family="Arial, sans-serif" font-size="24" letter-spacing="4">IMAGE A AJOUTER</text>'
      + '</svg>';
    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
  }

  function applyFallbackImages(root){
    var images = root.querySelectorAll("img[data-fallback-label]");
    for (var i = 0; i < images.length; i++) {
      (function(image){
        image.addEventListener("error", function(){
          if (image.dataset.fallbackApplied === "true") {
            return;
          }
          image.dataset.fallbackApplied = "true";
          image.src = makePlaceholder(image.getAttribute("data-fallback-label"), image.getAttribute("data-fallback-tone"));
        });
      })(images[i]);
    }
  }

  function getSectionBySlug(slug){
    for (var i = 0; i < SECTIONS.length; i++) {
      if (SECTIONS[i].slug === slug) {
        return SECTIONS[i];
      }
    }
    return SECTIONS[0];
  }

  function activateTab(slug, shouldFocus){
    var section = getSectionBySlug(slug);
    var tabs = document.querySelectorAll(".tab");
    var panels = document.querySelectorAll(".tab-panel");
    var activeTab = null;

    document.getElementById("appShell").setAttribute("data-theme", section.slug);

    for (var i = 0; i < tabs.length; i++) {
      var selected = tabs[i].getAttribute("data-slug") === section.slug;
      tabs[i].setAttribute("aria-selected", selected ? "true" : "false");
      tabs[i].setAttribute("tabindex", selected ? "0" : "-1");
      if (selected) {
        activeTab = tabs[i];
      }
    }

    for (var j = 0; j < panels.length; j++) {
      var isActive = panels[j].getAttribute("data-slug") === section.slug;
      panels[j].classList.toggle("is-active", isActive);
    }

    if (location.hash !== "#" + section.slug) {
      history.replaceState(null, "", "#" + section.slug);
    }
    if (shouldFocus && activeTab) {
      activeTab.focus();
    }
  }

  function moveTabFocus(currentSlug, direction){
    var index = 0;
    for (var i = 0; i < SECTIONS.length; i++) {
      if (SECTIONS[i].slug === currentSlug) {
        index = i;
        break;
      }
    }
    index = (index + direction + SECTIONS.length) % SECTIONS.length;
    activateTab(SECTIONS[index].slug, true);
  }

  function bindTabs(){
    var tablist = document.getElementById("tablist");
    tablist.addEventListener("click", function(event){
      var button = event.target.closest(".tab");
      if (!button) {
        return;
      }
      activateTab(button.getAttribute("data-slug"), false);
    });

    tablist.addEventListener("keydown", function(event){
      var button = event.target.closest(".tab");
      if (!button) {
        return;
      }
      var slug = button.getAttribute("data-slug");
      if (event.key === "ArrowRight") {
        event.preventDefault();
        moveTabFocus(slug, 1);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        moveTabFocus(slug, -1);
      } else if (event.key === "Home") {
        event.preventDefault();
        activateTab(SECTIONS[0].slug, true);
      } else if (event.key === "End") {
        event.preventDefault();
        activateTab(SECTIONS[SECTIONS.length - 1].slug, true);
      }
    });

    window.addEventListener("hashchange", function(){
      var slug = (location.hash || "").replace("#", "");
      activateTab(getSectionBySlug(slug).slug, false);
    });
  }

  renderTabs();
  renderPanels();
  applyFallbackImages(document);
  bindTabs();
  activateTab(getSectionBySlug((location.hash || "").replace("#", "")).slug, false);
  </script>
</body>
</html>
