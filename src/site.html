<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sélection d'été</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{
      --bg:#f7f2ea;
      --ink:#2d271f;
      --muted:#6f665a;
      --card:#fffdf8;
      --line:rgba(70,52,30,.12);
      --shadow:0 12px 32px rgba(42,30,14,.10);
      --radius:22px;
      --space:24px;
      --space-sm:16px;
      --accent:#b7842c;
      --accent-soft:rgba(183,132,44,.14);
      --hero-start:#d3a647;
      --hero-end:#7b5521;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.72), transparent 28%),
        linear-gradient(180deg, #fbf7f1 0%, #f3ece1 100%);
      color:var(--ink);
      font-family: ui-serif, Georgia, "Times New Roman", Times, serif;
      line-height:1.55;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(135deg, rgba(255,255,255,.18), transparent 36%),
        radial-gradient(circle at 85% 10%, rgba(255,255,255,.28), transparent 18%);
      opacity:.9;
    }
    .wrap{
      position:relative;
      z-index:1;
      max-width:1100px;
      margin:0 auto;
      padding:28px 24px 36px;
    }
    .site-head{
      margin:0 0 var(--space);
      padding:22px 24px;
      border-radius:var(--radius);
      background:rgba(255,251,244,.72);
      border:1px solid rgba(115,82,36,.08);
      box-shadow:var(--shadow);
      backdrop-filter:blur(8px);
    }
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 12px;
      border-radius:999px;
      font-size:12px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--accent);
      background:var(--accent-soft);
    }
    .site-head h1{
      margin:14px 0 8px;
      font-size:clamp(32px, 5vw, 52px);
      line-height:1.02;
      letter-spacing:.02em;
    }
    .lead{
      max-width:720px;
      margin:0;
      color:var(--muted);
      font-size:clamp(17px, 2.3vw, 20px);
    }
    .tabs{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin:0 0 var(--space);
    }
    .tab{
      appearance:none;
      border:1px solid var(--line);
      background:rgba(255,255,255,.72);
      color:var(--ink);
      border-radius:999px;
      padding:12px 18px;
      font:inherit;
      font-size:16px;
      cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
      box-shadow:0 8px 18px rgba(42,30,14,.05);
    }
    .tab:hover,
    .tab:focus-visible{
      transform:translateY(-1px);
      border-color:rgba(70,52,30,.22);
      outline:none;
    }
    .tab[aria-selected="true"]{
      background:var(--accent);
      color:#fff;
      border-color:transparent;
      box-shadow:0 14px 24px rgba(42,30,14,.15);
    }
    .tab-panel{
      display:none;
    }
    .tab-panel.is-active{
      display:block;
    }
    .hero{
      position:relative;
      overflow:hidden;
      border-radius:var(--radius);
      margin:0 0 var(--space);
      background:linear-gradient(135deg, var(--hero-start), var(--hero-end));
      box-shadow:var(--shadow);
      isolation:isolate;
    }
    .hero-content{
      position:relative;
      z-index:1;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      padding:16px 18px;
      color:#fff;
    }
    .hero h2{
      margin:0;
      font-size:clamp(26px, 3.2vw, 40px);
      line-height:1.02;
    }
    .hero p{
      margin:0;
      font-size:clamp(15px, 1.7vw, 17px);
      color:rgba(255,247,236,.92);
    }
    .map-card{
      margin:0 0 var(--space);
      padding:22px;
      max-width:960px;
      border-radius:var(--radius);
      background:
        radial-gradient(circle at top right, rgba(255,255,255,.72), transparent 28%),
        linear-gradient(180deg, rgba(255,252,247,.98), rgba(253,246,239,.92));
      border:1px solid rgba(117,86,39,.09);
      box-shadow:var(--shadow);
    }
    .map-copy{
      margin:0 0 16px;
    }
    .map-copy h3{
      margin:0 0 8px;
      font-size:24px;
    }
    .map-copy p{
      margin:0;
      color:var(--muted);
      font-size:16px;
    }
    .map-copy-note{
      font-style:italic;
      font-size:14px;
      text-align:center;
    }
    .map-stage{
      position:relative;
      aspect-ratio:16/10;
      border-radius:20px;
      overflow:hidden;
      background:
        radial-gradient(circle at 24% 18%, rgba(255,255,255,.7), transparent 22%),
        linear-gradient(180deg, #f5ede0 0%, #efe1ce 100%);
      border:1px solid rgba(117,86,39,.08);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.32);
    }
    .leaflet-map{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
    }
    .leaflet-container{
      font:inherit;
      background:#efe1ce;
    }
    .leaflet-marker-icon.region-pin-icon{
      background:transparent;
      border:none;
    }
    .region-pin{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
      width:160px;
      text-align:center;
      pointer-events:none;
    }
    .region-pin-label{
      display:inline-block;
      padding:6px 9px;
      border-radius:999px;
      background:rgba(45,39,31,.92);
      color:#fff;
      box-shadow:none;
      font-size:12px;
      line-height:1.2;
      white-space:nowrap;
    }
    .region-pin-dot{
      width:18px;
      height:18px;
      border-radius:999px;
      background:#7f2e40;
      border:2px solid #fff8f0;
      box-shadow:0 8px 18px rgba(42,30,14,.16);
    }
    .region-pin.is-active .region-pin-dot{
      width:22px;
      height:22px;
      background:#b24b64;
      border-width:3px;
    }
    .map-overlay{
      position:absolute;
      left:18px;
      bottom:18px;
      width:min(320px, calc(100% - 36px));
      padding:16px 16px 14px;
      border-radius:18px;
      background:rgba(255,252,247,.96);
      border:1px solid rgba(117,86,39,.12);
      box-shadow:0 20px 36px rgba(42,30,14,.12);
      backdrop-filter:blur(10px);
      pointer-events:none;
      z-index:450;
      opacity:0;
      visibility:hidden;
      transform:translateY(8px);
      transition:opacity .18s ease, transform .18s ease, visibility .18s ease;
    }
    .map-outside-button{
      position:absolute;
      right:18px;
      bottom:18px;
      z-index:420;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:6px;
      max-width:min(280px, calc(100% - 36px));
      padding:0;
      border:none;
      background:transparent;
      color:var(--ink);
      text-align:left;
      cursor:pointer;
      touch-action:manipulation;
    }
    .map-outside-button:focus-visible{
      outline:2px solid rgba(127,46,64,.5);
      outline-offset:2px;
    }
    .map-outside-dot{
      width:18px;
      height:18px;
      flex:0 0 18px;
      border-radius:999px;
      background:#7f2e40;
      border:2px solid #fff8f0;
      box-shadow:0 8px 18px rgba(42,30,14,.16);
    }
    .map-outside-copy{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:2px;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(45,39,31,.92);
      color:#fff;
      box-shadow:0 12px 22px rgba(42,30,14,.14);
    }
    .map-outside-kicker{
      color:rgba(255,255,255,.72);
      font-size:11px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .map-outside-label{
      font-size:14px;
      font-weight:600;
      line-height:1.25;
    }
    .map-overlay.is-visible{
      opacity:1;
      visibility:visible;
      transform:translateY(0);
    }
    .map-overlay h4{
      margin:0 0 4px;
      font-size:24px;
    }
    .map-overlay p{
      margin:0 0 12px;
      color:var(--muted);
      font-size:14px;
    }
    .map-offers{
      display:grid;
      gap:8px;
    }
    .map-offer{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      padding:10px 12px;
      border-radius:14px;
      background:rgba(127,46,64,.06);
      font-size:14px;
    }
    .map-offer-meta{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:4px;
      min-width:0;
      flex:1;
    }
    .map-offer-heading{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
      flex-wrap:wrap;
    }
    .map-offer strong{
      font-size:14px;
      font-weight:600;
    }
    .map-offer-type{
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
    }
    .map-price{
      white-space:nowrap;
      color:#7f2e40;
      font-weight:700;
    }
    .map-offer-description{
      margin:0;
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }
    .producer{
      background:var(--card);
      border:1px solid rgba(117,86,39,.09);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      margin:0 0 var(--space);
    }
    .producer h3{
      margin:0 0 10px;
      font-size:24px;
    }
    .producer{
      display:grid;
      grid-template-columns:minmax(0, 280px) minmax(0, 1fr);
      gap:22px;
      padding:22px;
      align-items:center;
    }
    .producer-photo{
      margin:0;
      width:100%;
      aspect-ratio:4/3;
      border-radius:18px;
      overflow:hidden;
      background:linear-gradient(135deg, rgba(255,244,218,.95), rgba(214,183,128,.65));
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);
    }
    .producer-photo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .producer-body p{
      margin:0 0 12px;
      color:var(--muted);
      font-size:16px;
    }
    .producer-body p:last-child{
      margin-bottom:0;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:20px;
    }
    .card{
      display:flex;
      flex-direction:column;
      min-height:100%;
      overflow:hidden;
      border-radius:var(--radius);
      background:var(--card);
      border:1px solid rgba(117,86,39,.08);
      box-shadow:var(--shadow);
      transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease, opacity .2s ease;
    }
    .card.is-linked{
      border-color:rgba(127,46,64,.35);
      box-shadow:0 18px 30px rgba(60,24,32,.14);
      transform:translateY(-2px);
    }
    .card.is-dimmed{
      opacity:.52;
    }
    .photo{
      aspect-ratio:4/3;
      background:linear-gradient(135deg, rgba(255,245,220,.92), rgba(223,205,176,.9));
    }
    .tab-panel[data-slug="miel"] .photo{
      aspect-ratio:16/10;
    }
    .card img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .body{
      display:flex;
      flex:1;
      flex-direction:column;
      padding:18px 18px 20px;
    }
    .product-type{
      display:inline-flex;
      align-self:flex-start;
      margin:0 0 10px;
      padding:7px 11px;
      border-radius:999px;
      background:rgba(127,46,64,.08);
      color:var(--accent);
      font-size:11px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .body h3{
      margin:0 0 8px;
      font-size:22px;
    }
    .body p{
      margin:0 0 14px;
      color:var(--muted);
      font-size:15px;
    }
    .prices{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:auto;
    }
    .pill{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:3px;
      padding:9px 12px;
      border-radius:14px;
      background:rgba(255,255,255,.9);
      border:1px solid rgba(117,86,39,.12);
      font-size:14px;
    }
    .pill-label{
      font-size:11px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--accent);
    }
    .status-note{
      display:inline-flex;
      align-self:flex-start;
      padding:9px 12px;
      border-radius:14px;
      background:var(--accent-soft);
      color:var(--accent);
      font-size:14px;
    }
    footer{
      margin:36px 0 0;
      text-align:center;
      color:var(--muted);
      font-size:14px;
    }
    .app[data-theme="miel"]{
      --accent:#ba8b29;
      --accent-soft:rgba(186,139,41,.14);
      --hero-start:#dfb34e;
      --hero-end:#8a5d20;
    }
    .app[data-theme="vin"]{
      --accent:#7f2e40;
      --accent-soft:rgba(127,46,64,.14);
      --hero-start:#9f4558;
      --hero-end:#431620;
    }
    .app[data-theme="porc"]{
      --accent:#b55d3a;
      --accent-soft:rgba(181,93,58,.14);
      --hero-start:#cf845d;
      --hero-end:#6d3624;
    }
    @media (max-width:760px){
      .wrap{
        padding:20px 16px 28px;
      }
      .site-head,
      .intro,
      .producer{
        padding-left:18px;
        padding-right:18px;
      }
      .producer{
        grid-template-columns:1fr;
      }
      .map-card{
        padding:18px;
      }
      .grid{
        grid-template-columns:1fr;
        gap:16px;
      }
      .tabs{
        gap:10px;
      }
      .tab{
        flex:1 1 0;
        min-width:0;
        text-align:center;
        touch-action:manipulation;
      }
      .map-copy h3{
        font-size:20px;
      }
      .map-copy-note{
        font-size:13px;
      }
      .map-stage{
        aspect-ratio:4/5;
      }
      .map-overlay{
        left:12px;
        right:12px;
        bottom:12px;
        width:auto;
        padding:14px 14px 12px;
      }
      .map-outside-button{
        right:12px;
        bottom:12px;
        max-width:180px;
      }
      .region-pin{
        width:132px;
        gap:3px;
      }
      .region-pin-label{
        padding:5px 8px;
        font-size:11px;
      }
    }
  </style>
</head>

  function escapeHtml(value){
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function renderTabs(){
    var html = "";
    for (var i = 0; i < SECTIONS.length; i++) {
      var section = SECTIONS[i];
      html += '<button class="tab" id="tab-' + section.slug + '" type="button" role="tab" aria-selected="false" aria-controls="panel-' + section.slug + '" tabindex="-1" data-slug="' + section.slug + '">' + escapeHtml(section.label) + '</button>';
    }
    document.getElementById("tablist").innerHTML = html;
  }

  function renderProducer(producer, section){
    if (!producer) {
      return "";
    }

    var html = '<section class="producer">';
    html += '<figure class="producer-photo">';
    html += '<img src="' + producer.image + '" alt="' + escapeHtml(producer.alt) + '" data-fallback-label="' + escapeHtml(producer.title) + '" data-fallback-tone="' + section.slug + '">';
    html += '</figure>';
    html += '<div class="producer-body">';
    html += '<h3>' + escapeHtml(producer.title) + '</h3>';
    for (var i = 0; i < producer.paragraphs.length; i++) {
      html += '<p>' + escapeHtml(producer.paragraphs[i]) + '</p>';
    }
    html += '</div>';
    html += '</section>';
    return html;
  }

  function getProductsByIds(products, ids){
    var selected = [];
    for (var i = 0; i < ids.length; i++) {
      for (var j = 0; j < products.length; j++) {
        if (products[j].id === ids[i]) {
          selected.push(products[j]);
          break;
        }
      }
    }
    return selected;
  }

  function getProductPrice(product){
    if (product.options && product.options.length && product.options[0].price) {
      return product.options[0].price;
    }
    if (product.note) {
      return product.note;
    }
    return "";
  }

  function getOffersByIds(products, ids){
    var offers = [];
    var selected = getProductsByIds(products, ids);
    for (var i = 0; i < selected.length; i++) {
      offers.push({
        name: selected[i].name,
        type: selected[i].type || "",
        description: selected[i].description || "",
        price: getProductPrice(selected[i])
      });
    }
    return offers;
  }

  function renderMapOffers(offers){
    if (!offers.length) {
      return '<div class="map-offer"><strong>Sélection visible sur la carte</strong><span class="map-price">€</span></div>';
    }

    var html = "";
    for (var i = 0; i < offers.length; i++) {
      html += '<div class="map-offer">';
      html += '<div class="map-offer-meta">';
      html += '<div class="map-offer-heading">';
      html += '<strong>' + escapeHtml(offers[i].name) + '</strong>';
      if (offers[i].type) {
        html += '<span class="map-offer-type">' + escapeHtml(offers[i].type) + '</span>';
      }
      html += '</div>';
      if (offers[i].description) {
        html += '<p class="map-offer-description">' + escapeHtml(offers[i].description) + '</p>';
      }
      html += '</div>';
      html += '<span class="map-price">' + escapeHtml(offers[i].price) + '</span>';
      html += '</div>';
    }
    return html;
  }

  function renderMap(map, section){
    if (!map || !map.regions || !map.regions.length) {
      return "";
    }

    var html = '<section class="map-card" data-map-card data-map-slug="' + section.slug + '" aria-labelledby="map-title-' + section.slug + '">';
    html += '<div class="map-copy">';
    html += '<h3 id="map-title-' + section.slug + '">' + escapeHtml(map.title) + '</h3>';
    if (map.intro) {
      html += '<p class="map-copy-note">' + escapeHtml(map.intro) + '</p>';
    }
    html += '</div>';
    html += '<div class="map-stage">';
    html += '<div class="leaflet-map" data-leaflet-map></div>';
    html += '<div class="map-empty" data-map-empty hidden>Carte indisponible hors connexion.</div>';
    if (map.outsideProducts && map.outsideProducts.length) {
      var outsideOffers = getOffersByIds(section.products, map.outsideProducts);
      var outsideLabel = outsideOffers.length ? outsideOffers[0].name : (map.outsideTitle || "Hors carte");
      html += '<button class="map-outside-button" type="button" data-map-outside>';
      html += '<span class="map-outside-dot" aria-hidden="true"></span>';
      html += '<span class="map-outside-copy">';
      html += '<span class="map-outside-kicker">' + escapeHtml(map.outsideTitle || "Hors carte") + '</span>';
      html += '<span class="map-outside-label">' + escapeHtml(outsideLabel) + '</span>';
      html += '</span>';
      html += '</button>';
    }
    html += '<div class="map-overlay">';
    html += '<h4 data-map-title>Nos domaines</h4>';
    html += '<div class="map-offers" data-map-offers>' + renderMapOffers([]) + '</div>';
    html += '</div>';
    html += '</div>';
    html += '</section>';
    return html;
  }

  function getMapConfigForCard(mapCard){
    var slug = mapCard.getAttribute("data-map-slug");
    return getSectionBySlug(slug).map;
  }

  function findRegionById(mapCard, regionId){
    var config = getMapConfigForCard(mapCard);
    for (var i = 0; i < config.regions.length; i++) {
      if (config.regions[i].id === regionId) {
        return config.regions[i];
      }
    }
    return null;
  }

  function getOutsideOffers(mapCard){
    var section = getSectionBySlug(mapCard.getAttribute("data-map-slug"));
    var config = getMapConfigForCard(mapCard);
    return getOffersByIds(section.products, config.outsideProducts || []);
  }

  function showMapFallback(mapCard){
    var fallback = mapCard.querySelector("[data-map-empty]");
    if (fallback) {
      fallback.hidden = false;
    }
  }

  function showAllMapFallbacks(){
    var mapCards = document.querySelectorAll("[data-map-card]");
    for (var i = 0; i < mapCards.length; i++) {
      showMapFallback(mapCards[i]);
    }
  }

  function loadLeafletScript(){
    if (window.L) {
      return Promise.resolve(window.L);
    }
    if (leafletLoadPromise) {
      return leafletLoadPromise;
    }

    leafletLoadPromise = new Promise(function(resolve, reject){
      var existing = document.querySelector("script[data-leaflet-loader='true']");
      if (existing) {
        existing.addEventListener("load", function(){ resolve(window.L); }, { once: true });
        existing.addEventListener("error", function(){ reject(new Error("leaflet-load-failed")); }, { once: true });
        return;
      }

      var script = document.createElement("script");
      script.src = LEAFLET_SCRIPT_URL;
      script.async = true;
      script.dataset.leafletLoader = "true";
      script.onload = function(){
        resolve(window.L);
      };
      script.onerror = function(){
        reject(new Error("leaflet-load-failed"));
      };
      document.head.appendChild(script);
    });

    return leafletLoadPromise;
  }

  function createTileLayer(){
    return L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    });
  }

  function createRegionMarker(region){
    return L.marker([region.lat, region.lng], {
      icon: L.divIcon({
        className: "region-pin-icon",
        html: '<span class="region-pin"><span class="region-pin-label">' + escapeHtml(region.name) + '</span><span class="region-pin-dot"></span></span>',
        iconSize: [160, 46],
        iconAnchor: [80, 46]
      })
    });
  }

  function setMarkerActive(marker, isActive){
    var element = marker.getElement();
    if (element) {
      var pin = element.querySelector(".region-pin");
      if (pin) {
        pin.classList.toggle("is-active", isActive);
      }
    }
    marker.setZIndexOffset(isActive ? 1000 : 0);
    if (isActive) {
      marker.bringToFront();
    }
  }

  function ensureLeafletMaps(mapCard){
    if (mapCard._leafletState) {
      return mapCard._leafletState;
    }
    if (!window.L) {
      return null;
    }

    var config = getMapConfigForCard(mapCard);
    var stage = mapCard.querySelector("[data-leaflet-map]");
    if (!stage) {
      return null;
    }

    var mainMap = L.map(stage, {
      scrollWheelZoom: false,
      dragging: false,
      touchZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false,
      zoomControl: false,
      attributionControl: false
    });
    createTileLayer().addTo(mainMap);
    mainMap.setView(config.center, config.zoom);

    var markers = {};
    for (var i = 0; i < config.regions.length; i++) {
      var region = config.regions[i];
      var marker = createRegionMarker(region).addTo(mainMap);
      marker.on("mouseover", (function(targetRegion){
        return function(){
          setMapRegion(mapCard, targetRegion.id);
        };
      })(region));
      marker.on("mouseout", function(){
        resetMapRegion(mapCard);
      });
      marker.on("click", (function(targetRegion){
        return function(){
          setMapRegion(mapCard, targetRegion.id);
        };
      })(region));
      markers[region.id] = marker;
    }

    mapCard._leafletState = {
      mainMap: mainMap,
      markers: markers,
      center: config.center,
      zoom: config.zoom
    };
    return mapCard._leafletState;
  }

  function invalidateLeafletMaps(mapCard){
    var state = ensureLeafletMaps(mapCard);
    if (!state) {
      return;
    }
    window.requestAnimationFrame(function(){
      state.mainMap.invalidateSize();
      state.mainMap.setView(state.center, state.zoom, { animate: false });
    });
  }

  function resetMapRegion(mapCard){
    var title = mapCard.querySelector("[data-map-title]");
    var offers = mapCard.querySelector("[data-map-offers]");
    var overlay = mapCard.querySelector(".map-overlay");
    var state = ensureLeafletMaps(mapCard);

    title.textContent = "Nos domaines";
    offers.innerHTML = renderMapOffers([]);
    if (overlay) {
      overlay.classList.remove("is-visible");
    }

    if (state) {
      for (var markerId in state.markers) {
        if (Object.prototype.hasOwnProperty.call(state.markers, markerId)) {
          setMarkerActive(state.markers[markerId], false);
        }
      }
    }
  }

  function setMapOutside(mapCard){
    var title = mapCard.querySelector("[data-map-title]");
    var offers = mapCard.querySelector("[data-map-offers]");
    var overlay = mapCard.querySelector(".map-overlay");
    var config = getMapConfigForCard(mapCard);
    var state = ensureLeafletMaps(mapCard);

    title.textContent = config.outsideTitle || "Hors carte";
    offers.innerHTML = renderMapOffers(getOutsideOffers(mapCard));
    if (overlay) {
      overlay.classList.add("is-visible");
    }

    if (state) {
      for (var markerId in state.markers) {
        if (Object.prototype.hasOwnProperty.call(state.markers, markerId)) {
          setMarkerActive(state.markers[markerId], false);
        }
      }
    }
  }

  function renderProducts(products, section){
    var html = '<div class="grid">';
    for (var i = 0; i < products.length; i++) {
      var product = products[i];
      html += '<article class="card" id="' + product.id + '">';
      html += '<div class="photo">';
      html += '<img src="' + product.image + '" alt="' + escapeHtml(product.name) + '" data-fallback-label="' + escapeHtml(product.name) + '" data-fallback-tone="' + section.slug + '">';
      html += '</div>';
      html += '<div class="body">';
      if (product.type) {
        html += '<div class="product-type">' + escapeHtml(product.type) + '</div>';
      }
      html += '<h3>' + escapeHtml(product.name) + '</h3>';
      html += '<p>' + escapeHtml(product.description) + '</p>';
      if (product.options && product.options.length) {
        html += '<div class="prices">';
        for (var j = 0; j < product.options.length; j++) {
          var option = product.options[j];
          html += '<span class="pill">';
          html += '<span class="pill-label">' + escapeHtml(option.label) + '</span>';
          html += '<span>' + escapeHtml(option.price) + '</span>';
          html += '</span>';
        }
        html += '</div>';
      } else if (product.note) {
        html += '<span class="status-note">' + escapeHtml(product.note) + '</span>';
      }
      html += '</div>';
      html += '</article>';
    }
    html += '</div>';
    return html;
  }

  function renderPanels(){
    var html = "";
    for (var i = 0; i < SECTIONS.length; i++) {
      var section = SECTIONS[i];
      html += '<section class="tab-panel" id="panel-' + section.slug + '" role="tabpanel" aria-labelledby="tab-' + section.slug + '" data-slug="' + section.slug + '">';
      html += '<header class="hero">';
      html += '<div class="hero-content">';
      html += '<h2>' + escapeHtml(section.heroTitle) + '</h2>';
      html += '</div>';
      html += '</header>';
      html += renderProducer(section.producer, section);
      html += renderMap(section.map, section);
      if (section.slug !== "vin") {
        html += renderProducts(section.products, section);
      }
      html += '</section>';
    }
    document.getElementById("panels").innerHTML = html;
  }

  function setMapRegion(mapCard, regionId){
    var title = mapCard.querySelector("[data-map-title]");
    var offers = mapCard.querySelector("[data-map-offers]");
    var overlay = mapCard.querySelector(".map-overlay");
    var section = getSectionBySlug(mapCard.getAttribute("data-map-slug"));
    var region = findRegionById(mapCard, regionId);
    var state = ensureLeafletMaps(mapCard);

    if (!region) {
      resetMapRegion(mapCard);
      return;
    }

    title.textContent = region.name;
    offers.innerHTML = renderMapOffers(getOffersByIds(section.products, region.products));
    if (overlay) {
      overlay.classList.add("is-visible");
    }

    if (state) {
      for (var markerId in state.markers) {
        if (Object.prototype.hasOwnProperty.call(state.markers, markerId)) {
          var marker = state.markers[markerId];
          var active = markerId === regionId;
          setMarkerActive(marker, active);
        }
      }
    }
  }

  function bindMaps(){
    var mapCards = document.querySelectorAll("[data-map-card]");
    for (var i = 0; i < mapCards.length; i++) {
      resetMapRegion(mapCards[i]);
      var outside = mapCards[i].querySelector("[data-map-outside]");
      if (outside) {
        (function(mapCard, trigger){
          trigger.addEventListener("mouseenter", function(){
            setMapOutside(mapCard);
          });
          trigger.addEventListener("mouseleave", function(){
            resetMapRegion(mapCard);
          });
          trigger.addEventListener("focus", function(){
            setMapOutside(mapCard);
          });
          trigger.addEventListener("blur", function(){
            resetMapRegion(mapCard);
          });
          trigger.addEventListener("click", function(){
            setMapOutside(mapCard);
          });
        })(mapCards[i], outside);
      }
    }
  }

  function fallbackPalette(tone){
    if (tone === "vin") {
      return { start: "#b0596a", end: "#4d1a26", text: "#fff5f7" };
    }
    if (tone === "porc") {
      return { start: "#d79069", end: "#713725", text: "#fff7f2" };
    }
    return { start: "#e0b451", end: "#875c22", text: "#fff9ef" };
  }

  function makePlaceholder(label, tone){
    var palette = fallbackPalette(tone);
    var safeLabel = String(label).replace(/[&<>"]/g, "");
    var svg = ''
      + '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">'
      + '<defs>'
      + '<linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">'
      + '<stop offset="0%" stop-color="' + palette.start + '"/>'
      + '<stop offset="100%" stop-color="' + palette.end + '"/>'
      + '</linearGradient>'
      + '</defs>'
      + '<rect width="1200" height="900" fill="url(#g)"/>'
      + '<circle cx="980" cy="170" r="120" fill="rgba(255,255,255,.12)"/>'
      + '<circle cx="180" cy="760" r="180" fill="rgba(255,255,255,.08)"/>'
      + '<text x="50%" y="48%" text-anchor="middle" fill="' + palette.text + '" font-family="Georgia, serif" font-size="52" letter-spacing="2">' + safeLabel + '</text>'
      + '</svg>';
    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
  }

  function applyFallbackImages(root){
    var images = root.querySelectorAll("img[data-fallback-label]");
    for (var i = 0; i < images.length; i++) {
      (function(image){
        image.addEventListener("error", function(){
          if (image.dataset.fallbackApplied === "true") {
            return;
          }
          image.dataset.fallbackApplied = "true";
          image.src = makePlaceholder(image.getAttribute("data-fallback-label"), image.getAttribute("data-fallback-tone"));
        });
      })(images[i]);
    }
  }

  function getSectionBySlug(slug){
    for (var i = 0; i < SECTIONS.length; i++) {
      if (SECTIONS[i].slug === slug) {
        return SECTIONS[i];
      }
    }
    return SECTIONS[0];
  }

  function activateTab(slug, shouldFocus){
    var section = getSectionBySlug(slug);
    var tabs = document.querySelectorAll(".tab");
    var panels = document.querySelectorAll(".tab-panel");
    var activeTab = null;

    document.getElementById("appShell").setAttribute("data-theme", section.slug);

    for (var i = 0; i < tabs.length; i++) {
      var selected = tabs[i].getAttribute("data-slug") === section.slug;
      tabs[i].setAttribute("aria-selected", selected ? "true" : "false");
      tabs[i].setAttribute("tabindex", selected ? "0" : "-1");
      if (selected) {
        activeTab = tabs[i];
      }
    }

    for (var j = 0; j < panels.length; j++) {
      var isActive = panels[j].getAttribute("data-slug") === section.slug;
      panels[j].classList.toggle("is-active", isActive);
    }

    if (location.hash !== "#" + section.slug) {
      history.replaceState(null, "", "#" + section.slug);
    }
    if (section.map) {
      var activePanel = document.getElementById("panel-" + section.slug);
      var mapCards = activePanel ? activePanel.querySelectorAll("[data-map-card]") : [];
      for (var k = 0; k < mapCards.length; k++) {
        invalidateLeafletMaps(mapCards[k]);
      }
    }
    if (shouldFocus && activeTab) {
      activeTab.focus();
    }
  }

  function moveTabFocus(currentSlug, direction){
    var index = 0;
    for (var i = 0; i < SECTIONS.length; i++) {
      if (SECTIONS[i].slug === currentSlug) {
        index = i;
        break;
      }
    }
    index = (index + direction + SECTIONS.length) % SECTIONS.length;
    activateTab(SECTIONS[index].slug, true);
  }

  function bindTabs(){
    var tablist = document.getElementById("tablist");
    tablist.addEventListener("click", function(event){
      var button = event.target.closest(".tab");
      if (!button) {
        return;
      }
      activateTab(button.getAttribute("data-slug"), false);
    });

    tablist.addEventListener("keydown", function(event){
      var button = event.target.closest(".tab");
      if (!button) {
        return;
      }
      var slug = button.getAttribute("data-slug");
      if (event.key === "ArrowRight") {
        event.preventDefault();
        moveTabFocus(slug, 1);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        moveTabFocus(slug, -1);
      } else if (event.key === "Home") {
        event.preventDefault();
        activateTab(SECTIONS[0].slug, true);
      } else if (event.key === "End") {
        event.preventDefault();
        activateTab(SECTIONS[SECTIONS.length - 1].slug, true);
      }
    });

    window.addEventListener("hashchange", function(){
      var slug = (location.hash || "").replace("#", "");
      activateTab(getSectionBySlug(slug).slug, false);
    });
  }

  renderTabs();
  renderPanels();
  bindMaps();
  bindTabs();
  activateTab(getSectionBySlug((location.hash || "").replace("#", "")).slug, false);
  loadLeafletScript().then(function(){
    var mapCards = document.querySelectorAll("[data-map-card]");
    for (var i = 0; i < mapCards.length; i++) {
      ensureLeafletMaps(mapCards[i]);
      invalidateLeafletMaps(mapCards[i]);
    }
  }).catch(function(){
    showAllMapFallbacks();
  });
  </script>
