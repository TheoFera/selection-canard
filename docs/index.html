<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accès réservé</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <style>
    :root{ --bg:#f6f2ea; --ink:#222; --muted:#666; --accent:#9c6b3d; --card:#ffffff; --radius:18px; --shadow:0 10px 30px rgba(0,0,0,.08); }
    *{ box-sizing:border-box }
    html,body{ height:100%; margin:0; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji"; }
    .center{ min-height:100%; display:grid; place-items:center; padding:20px }
    .panel{ width:min(520px, 92vw); background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:28px }
    h1{ margin:0 0 6px 0; font-size:clamp(22px, 4vw, 28px) }
    p{ margin:0 0 16px 0; color:var(--muted) }
        .input-wrap{ position:relative }
    .pw-field{ width:100%; padding:14px 48px 14px 16px; border:1px solid #ddd; border-radius:12px; font-size:16px; outline:none }
    .toggle-pw{ position:absolute; top:50%; right:12px; transform:translateY(-50%); background:transparent; border:0; padding:6px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); transition:background .2s, color .2s }
    .toggle-pw:hover, .toggle-pw:focus-visible{ background:rgba(0,0,0,.04); color:var(--ink) }
    .toggle-pw svg{ width:20px; height:20px }
    .toggle-pw .icon-hide{ display:none }
    .toggle-pw.is-on .icon-show{ display:none }
    .toggle-pw.is-on .icon-hide{ display:inline }
    .panel button[type=submit]{ width:100%; margin-top:12px; padding:12px 16px; border:0; background:var(--accent); color:#fff; border-radius:12px; font-size:16px; cursor:pointer }
    .hint{ font-size:13px; color:var(--muted); margin-top:10px }
    .error{ color:#b00020; margin-top:10px }
    footer{ text-align:center; margin-top:14px; font-size:12px; color:#999 }
  </style>
</head>
<body>
  <div class="center">
    <div class="panel">
      <h1></h1>
      <p>Entrez le mot de passe.</p>
      <form id="form">
        <div class="input-wrap">
          <input id="pw" class="pw-field" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
          <button id="togglePw" type="button" class="toggle-pw" aria-label="Afficher le mot de passe" aria-pressed="false">
            <svg class="icon-show" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 5c-4.5 0-8.4 2.9-10 7 1.6 4.1 5.5 7 10 7s8.4-2.9 10-7c-1.6-4.1-5.5-7-10-7Zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Zm0-2.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" fill="currentColor"/>
            </svg>
            <svg class="icon-hide" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3.3 2.3 2 3.6l3.2 3.2C3 8.6 1.7 10.6 1 12c1.6 4.1 5.5 7 10 7 2.1 0 4-.6 5.7-1.6l3.3 3.3 1.3-1.3-18-17Zm8.5 15.7A4.5 4.5 0 0 1 9 13.3l2.8 2.8c0 .1 0 0 0 0Zm-6.4-9.4 2.1 2.1a4.5 4.5 0 0 0 5.5 5.5l1.6 1.6c-.9.4-1.8.6-2.8.6-3.5 0-6.7-2.2-8-5.4.5-1.1 1.2-2.1 2-3Zm5.6-.4 5 5a2 2 0 0 0-5-5Zm1-3.2c3.5 0 6.7 2.2 8 5.4-.6 1.3-1.4 2.4-2.5 3.3l-1.4-1.4a4.5 4.5 0 0 0-5.9-5.9l-1.5-1.4c1-.3 2-.5 3.3-.5Z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <button type="submit">Entrer</button>
        <div id="msg" class="error" role="alert" aria-live="polite"></div>
      </form>
      <footer></footer>
    </div>
  </div>

  <script>
  // Déverrouillage via WebCrypto (PBKDF2 + AES‑GCM)
  const PAYLOAD_URL = "./payload.json"; // généré par encrypt.mjs
  async function deriveKey(password, salt, iterations){
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password.toLowerCase().trim()),
      {name:"PBKDF2"}, false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      {name:"PBKDF2", salt, iterations, hash:"SHA-256"},
      keyMaterial, {name:"AES-GCM", length:256}, false, ["decrypt"]
    );
  }
  function b64tobin(b64){ return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }
  function decodeUtf8(buf){ return new TextDecoder("utf-8").decode(buf); }

  document.getElementById("form").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    const msg = document.getElementById("msg");
    msg.textContent = "";
    try{
      const meta = await fetch(PAYLOAD_URL, {cache:"no-store"}).then(r=>r.json());
      const salt = b64tobin(meta.salt);
      const iv   = b64tobin(meta.iv);
      const data = b64tobin(meta.data);
      const key  = await deriveKey(pw, salt, meta.iterations);
      const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, data);
      const html = decodeUtf8(plain);
      document.open(); document.write(html); document.close();
    }catch(err){
      msg.textContent = "Mot de passe incorrect.";
    }
  });
  const pwInput = document.getElementById("pw");
  const togglePw = document.getElementById("togglePw");
  if(togglePw && pwInput){
    togglePw.addEventListener("click", ()=>{
      const isText = pwInput.getAttribute("type") === "text";
      pwInput.setAttribute("type", isText ? "password" : "text");
      togglePw.classList.toggle("is-on", !isText);
      togglePw.setAttribute("aria-pressed", String(!isText));
      togglePw.setAttribute("aria-label", isText ? "Afficher le mot de passe" : "Masquer le mot de passe");
    });
  }
  </script>
</body>
</html>
